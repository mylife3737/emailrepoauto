name: Daily Trends Email

on:
  schedule:
    - cron: '0 13 * * *'   # runs daily at 13:00 UTC
  workflow_dispatch:        # enable manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Force JavaScript actions to run on Node.js 24 (to avoid Node.js 20 deprecation)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Node.js 24 (optional, recommended)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show runtime info (debug)
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Workflow: $GITHUB_WORKFLOW"
          node --version || true
          npm --version || true
          python --version
          python -m pip --version
          env | sort

      - name: Install dependencies
        run: |
          set -x
          python -m pip install --upgrade pip
          python -m pip install --upgrade requests beautifulsoup4 lxml google-api-python-client
          python -m pip check

      - name: Execute Automation (verbose)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          set -x
          python -u update_trends.py
