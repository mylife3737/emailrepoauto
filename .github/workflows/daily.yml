name: Daily Trends Email

on:
  schedule:
    - cron: '0 13 * * *' 
  workflow_dispatch: 

env:
  # This clears the deprecation warning by opting into the new Node version early
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml google-api-python-client
        
      - name: Run script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python update_trends.py
