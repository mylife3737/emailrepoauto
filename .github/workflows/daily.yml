name: Daily Trends Email

on:
  schedule:
    - cron: '0 13 * * *' 
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Use latest stable v4 release
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Step 2: Use latest stable v5 release
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # Step 3: Explicit dependency install with verbose output
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml google-api-python-client
        
      # Step 4: Run script with full traceback visibility
      - name: Execute Automation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        # The '-u' flag ensures logs are sent to the console immediately
        run: python -u update_trends.py
