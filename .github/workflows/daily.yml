name: Daily Trends Email

on:
  schedule:
    - cron: '0 13 * * *' 
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Updated from v3
      
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated from v4
        with:
          python-version: '3.10'
       - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml google-api-python-client
