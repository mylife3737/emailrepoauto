yaml

name: Daily Trends Email

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  # Do not rely on undocumented vars; remove FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Node (for JS-based actions compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show environment and runtime info (debug)
        run: |
          echo "Runner OS: $RUNNER_OS"
          node --version || true
          npm --version || true
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests beautifulsoup4 lxml google-api-python-client
          python -m pip check

      - name: Run script (verbose)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          set -x
          python update_trends.py
