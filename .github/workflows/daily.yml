name: Daily Trends Email

on:
  schedule:
    - cron: '0 13 * * *' 
  workflow_dispatch: 

env:
  # This triggers the 'DetermineActionsNodeVersion' to resolve to Node 24
  # so the deprecation warning/block is bypassed.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # Ensuring all libraries from fetch_trends.py and update_trends.py are present
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml google-api-python-client
        
      - name: Run script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        # Executes update_trends.py once the runtime is resolved
        run: python update_trends.py
